<header class="header">
  <div class="container header-wrapper">
    <!-- Logo -->
    <div class="logo">
      <a routerLink="/">
        <img src="/logo.png" alt="KS Logo" />
      </a>
    </div>

    <!-- Desktop / Tablet Menu -->
    <nav class="desktop-nav">
      @for (item of menuItems; track item.id) {
        <a (click)="scrollTo(item.id)">
          {{ item.title }}
        </a>
      }
    </nav>

    <!-- Desktop / Tablet Right Side -->
    <div class="right-section desktop-right">
      <span class="email"> kshitij.somwanshi2001@gmail.com </span>

      <button type="button" (click)="scrollTo('contact')">HIRE ME</button>
    </div>

    <!-- Mobile Menu Button -->
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile Menu -->
  @if (isMenuOpen) {
    <div class="mobile-menu">
      @for (item of menuItems; track item.id) {
        <a (click)="scrollTo(item.id)">
          {{ item.title }}
        </a>
      }

      <button type="button" (click)="scrollTo('contact')">HIRE ME</button>
    </div>
  }
</header>
