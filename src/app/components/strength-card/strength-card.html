<div class="strength-card">
  <div class="icon-box">
    <img [src]="strength.icon" [alt]="strength.title" />
  </div>

  <h3>
    {{ strength.title }}
  </h3>

  <p>
    {{ strength.level }}
  </p>

  @if (strength.progress && strength.progress > 0) {
    <div class="progress">
      <div class="progress-fill" [style.width.%]="strength.progress"></div>
    </div>
  }
</div>
