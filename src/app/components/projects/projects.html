<section class="projects" id="projects">
  <div class="container">

      <span class="section-tag"> PROJECTS </span>

      <h2 class="projects-title">Selected Work</h2>

      <p class="projects-description">Real-World Products Shipped. Full Case Studies On Behance.</p>

    }
  </div>
</section>
